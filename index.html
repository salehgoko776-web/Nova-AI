<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova — AI Companion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080d;color:#f6f6fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:radial-gradient(circle at 50% 18%,#191735 0,#0a0b12 36%,#07080d 72%);display:flex;flex-direction:column;overflow:hidden}
main{flex:1;padding:22px 20px 95px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900;letter-spacing:3px}.muted{color:#85889a}.avatar{width:40px;height:40px;border-radius:50%;background:#181a27;border:1px solid #303348;color:#fff}
.hero{text-align:center;padding:58px 0 28px}.orb{width:126px;height:126px;border-radius:50%;margin:auto;background:radial-gradient(circle at 35% 30%,#c8c5ff,#716cff 28%,#3b367e 60%,#15142c 75%);box-shadow:0 0 70px #5f5aff55,0 0 120px #746dff22;animation:pulse 3s infinite}.orb:after{content:"";display:block;width:100%;height:100%;border-radius:50%;border:1px solid #aaa7ff33;transform:scale(1.16)}@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 90px #6c67ff66}}
h1{font-size:29px;margin:30px 0 9px}.sub{font-size:14px;color:#85889a}.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.chip{border:1px solid #272a3a;background:#11131c;color:#c9cad5;border-radius:20px;padding:10px 13px}
.composer{display:flex;gap:8px;align-items:center;background:#12141d;border:1px solid #2b2e40;border-radius:22px;padding:7px 8px 7px 15px;margin-top:30px}.composer input{flex:1;background:none;border:0;outline:0;color:#fff}.send{width:45px;height:45px;border:0;border-radius:17px;background:#7771ff;color:#fff;font-size:22px}
.tools{display:flex;justify-content:space-around;margin-top:15px}.tool{background:none;border:0;color:#8d8fa0}.tool b{display:block;font-size:21px;margin-bottom:3px}.nav{position:fixed;bottom:0;width:min(430px,100%);height:78px;background:#0b0c12ee;backdrop-filter:blur(18px);border-top:1px solid #222533;display:flex;justify-content:space-around;padding-top:11px}.nav button{background:none;border:0;color:#777b8c;font-size:11px}.nav button.active{color:#fff}.nav span{display:block;font-size:21px;margin-bottom:4px}
.pageTitle{font-size:28px;margin:16px 0 7px}.card{background:#11131c;border:1px solid #272a39;border-radius:20px;padding:18px;margin-top:13px}.row{display:flex;justify-content:space-between;align-items:center}.badge{font-size:11px;color:#aaa7ff;background:#252347;padding:5px 9px;border-radius:10px}.memory{line-height:1.5;color:#c8cad4}.delete{border:0;background:#20222d;color:#8e91a0;border-radius:9px;padding:7px 9px}.premium{background:linear-gradient(145deg,#17162e,#10111a);border:1px solid #5b57a5}.price{font-size:40px;font-weight:850;margin:8px 0}.price small{font-size:14px;color:#85889a}.cta{width:100%;padding:15px;border:0;border-radius:15px;background:#817bff;color:#fff;font-weight:800;margin-top:12px}.feature{padding:9px 0;color:#cfd0d9}.chat{display:flex;flex-direction:column;gap:12px;margin-top:20px}.bubble{max-width:82%;padding:13px 15px;border-radius:18px;line-height:1.45}.ai{background:#141620;border:1px solid #25283a;align-self:flex-start}.me{background:#706bdf;align-self:flex-end}.back{background:none;border:0;color:#a9abb8;font-size:14px}.person{display:flex;gap:10px;flex-wrap:wrap}.person button{flex:1;min-width:42%;padding:13px;border-radius:14px;background:#11131c;border:1px solid #292c3d;color:#bfc1ce}.person button.sel{border-color:#817bff;color:#fff;background:#1b1a36}.footer{text-align:center;color:#555867;font-size:9px;margin-top:16px}
</style>
</head>
<body><div class="app"><main id="main"></main><nav class="nav">
<button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="chat"><span>◌</span>Chat</button><button data-page="memory"><span>✦</span>Memory</button><button data-page="premium"><span>♛</span>Premium</button><button data-page="profile"><span>◉</span>Profile</button>
</nav></div>
<script>
const main=document.getElementById('main'); let page='home',messages=[['ai',"Hey 👋 I'm Nova. What are we getting into today?"]], memories=["You like friendly, natural conversations.","You prefer practical answers over fluff.","Nova should feel like a close, smart friend."], personality="Best Friend";
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='home')home(); if(page==='chat')chat(); if(page==='memory')memory(); if(page==='premium')premium(); if(page==='profile')profile();}
function top(){return `<div class="top"><div><div class="logo">NOVA ✦</div><div class="muted">Your AI companion</div></div><button class="avatar">S</button></div>`}
function home(){main.innerHTML=top()+`<section class="hero"><div class="orb"></div><h1>What are we doing today?</h1><div class="sub">I'm here. Tell me what's on your mind.</div></section><div class="chips">${["Plan my day","Let's brainstorm","Explain something","I'm bored 😭"].map(x=>`<button class="chip" onclick="start('${x}')">${x}</button>`).join('')}</div><div class="composer"><input id="homeInput" placeholder="Ask Nova anything..."><button class="send" onclick="sendHome()">↑</button></div><div class="tools"><button class="tool" onclick="voice()"><b>🎙</b>Voice</button><button class="tool"><b>📷</b>Vision</button><button class="tool"><b>✨</b>Create</button></div><div class="footer">Nova can make mistakes. Check important information.</div>`}
function start(x){messages.push(['me',x]);messages.push(['ai',reply(x)]);page='chat';render()}
function sendHome(){let v=document.getElementById('homeInput').value.trim();if(v)start(v)}
function reply(x){if(x.includes("bored"))return"Then let's fix that 😭 Give me 10 minutes and I'll find something fun we can do.";if(x.includes("day"))return"Easy. Tell me your top 3 priorities and I'll turn them into a realistic plan.";return"Got you. I'm on it — let's figure this out together."}
function chat(){main.innerHTML=`<button class="back" onclick="page='home';render()">← Nova</button><h2 class="pageTitle">Chat</h2><div class="chat">${messages.map(m=>`<div class="bubble ${m[0]==='ai'?'ai':'me'}">${m[1]}</div>`).join('')}</div><div class="composer"><input id="chatInput" placeholder="Message Nova..."><button class="send" onclick="sendChat()">↑</button></div>`}
function sendChat(){let v=document.getElementById('chatInput').value.trim();if(!v)return;messages.push(['me',v],['ai',reply(v)]);render()}
function memory(){main.innerHTML=top()+`<h2 class="pageTitle">Memory</h2><div class="sub">Nova remembers what matters — and you stay in control.</div>${memories.map((m,i)=>`<div class="card"><div class="row"><span class="badge">Long-term</span><button class="delete" onclick="memories.splice(${i},1);render()">Remove</button></div><div class="memory" style="margin-top:12px">${m}</div></div>`).join('')}<div class="card"><b>Privacy first</b><p class="muted">Memory is editable. Nova never needs to remember everything.</p></div>`}
function premium(){main.innerHTML=top()+`<div class="card premium" style="margin-top:40px"><span class="badge">MOST POPULAR</span><h2>Nova Premium</h2><div class="sub">Your smarter, more personal Nova.</div><div class="price">$19.99 <small>/ month</small></div>${["Advanced Nova intelligence","Deep long-term memory","Voice conversations","Vision & file analysis","Web research & Agent tools","Premium personalities"].map(x=>`<div class="feature">✓ ${x}</div>`).join('')}<button class="cta" onclick="alert('Checkout will connect here.')">Upgrade to Premium</button></div>`}
function profile(){main.innerHTML=top()+`<h2 class="pageTitle">Your Nova</h2><div class="card"><div class="row"><b>Personality</b><span class="badge">Customizable</span></div><div class="person" style="margin-top:15px">${["Best Friend","Genius","Comedian","Business Partner","Tutor","Gaming Buddy"].map(x=>`<button class="${x===personality?'sel':''}" onclick="personality='${x}';render()">${x}</button>`).join('')}</div></div><div class="card"><div class="row"><b>Language</b><span class="muted">Auto</span></div></div><div class="card"><div class="row"><b>Plan</b><span class="badge">Free</span></div></div>`}
function voice(){alert("Voice mode is ready to be connected to the realtime voice API.");}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()}); render();
</script></body></html>
